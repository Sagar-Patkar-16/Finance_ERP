<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotations · ERP Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#4F46E5">
</head>
<body>
<div class="app">
  <header class="topbar"></header>
  <main class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Quotations</div>
        <div class="page-subtitle">Opportunity → Quotation → Approval → Sales Order</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary">Export</button>
        <button class="btn btn-primary" id="newQuoteBtn">New Quotation</button>
      </div>
    </div>

    <div class="grid grid-kpi">
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Open Quotes</span></div><div class="kpi-value">18</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Value Open</span></div><div class="kpi-value">₹2.14 Cr</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Win Rate (QTD)</span></div><div class="kpi-value">42%</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Expiring 7 days</span></div><div class="kpi-value" style="color:var(--warning)">3</div></div>
    </div>

    <div class="table-toolbar" style="margin-top:var(--sp-5)">
      <div class="input-search" style="max-width:280px">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-3.5-3.5"/></svg>
        <input class="input" placeholder="Search quotes…" id="qSearch">
      </div>
      <select class="select" style="width:auto"><option>All statuses</option><option>Draft</option><option>Pending Approval</option><option>Sent</option><option>Accepted</option></select>
    </div>

    <div id="quoteTable"></div>
  </main>
</div>

<script type="module">
import { requireAuth, fmtCurrencyINR, fmtDate } from '../js/app.js';
import { mountShell } from '../js/nav.js';
import { dataTable, toast, confirmDialog } from '../js/components.js';
import * as api from '../js/api.js';

requireAuth();
const notifications = await api.getNotifications();
mountShell({ breadcrumb: ['Sales & CRM', 'Quotations'], notifications });

const quotes = [
  { id: 'Q-4011', customer: 'ABC Industries',    value: 480000,  date: '2026-08-22', expiry: '2026-09-05', ver: 'v2', status: 'Sent' },
  { id: 'Q-4012', customer: 'LMN Pharma',        value: 1240000, date: '2026-08-20', expiry: '2026-09-03', ver: 'v1', status: 'Pending Approval' },
  { id: 'Q-4013', customer: 'XYZ Manufacturing', value: 220000,  date: '2026-08-18', expiry: '2026-08-30', ver: 'v3', status: 'Draft' },
  { id: 'Q-4014', customer: 'PQR Engineering',   value: 680000,  date: '2026-08-15', expiry: '2026-08-29', ver: 'v1', status: 'Accepted' },
  { id: 'Q-4015', customer: 'DEF Tools',         value: 145000,  date: '2026-08-12', expiry: '2026-08-26', ver: 'v1', status: 'Sent' },
];

function render(filter = '') {
  const f = filter.toLowerCase();
  const rows = quotes.filter(q => !f || JSON.stringify(q).toLowerCase().includes(f));
  document.getElementById('quoteTable').innerHTML = dataTable({
    columns: [
      { label: 'Quote #', key: 'id', mono: true },
      { label: 'Customer', key: 'customer' },
      { label: 'Value', align: 'right', num: true, render: r => fmtCurrencyINR(r.value) },
      { label: 'Date', render: r => fmtDate(r.date) },
      { label: 'Expiry', render: r => {
        const days = Math.ceil((new Date(r.expiry) - new Date('2026-08-24')) / 86400000);
        return days <= 3
          ? `<span style="color:var(--critical)">${fmtDate(r.expiry)} (${days}d)</span>`
          : fmtDate(r.expiry);
      }},
      { label: 'Ver', key: 'ver', mono: true },
      { label: 'Status', render: r => {
        const map = { Draft:'neutral', 'Pending Approval':'warning', Sent:'info', Accepted:'success', Rejected:'critical' };
        return `<span class="chip chip-${map[r.status]}">${r.status}</span>`;
      }},
      { label: '', render: r => `
          <button class="btn btn-ghost btn-sm" data-view="${r.id}">View</button>
          ${r.status === 'Accepted' ? `<button class="btn btn-primary btn-sm" data-so="${r.id}">→ SO</button>` : ''}
      ` },
    ],
    rows
  });

  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    const q = quotes.find(x => x.id === b.dataset.view);
    toast(q.id, `${q.customer} · ${fmtCurrencyINR(q.value)} · ${q.status}`, 'info');
  }));
  document.querySelectorAll('[data-so]').forEach(b => b.addEventListener('click', async () => {
    const q = quotes.find(x => x.id === b.dataset.so);
    const ok = await confirmDialog({
      title: `Convert ${q.id} to Sales Order?`,
      message: `Customer: ${q.customer} · Value: ${fmtCurrencyINR(q.value)}. A new SO will be created.`,
      confirmText: 'Convert',
    });
    if (ok) { toast('Sales Order created', `SO-1050 from ${q.id}`, 'success'); }
  }));
}
render();
document.getElementById('qSearch').addEventListener('input', e => render(e.target.value));
document.getElementById('newQuoteBtn').addEventListener('click', () => toast('New Quotation', 'Quote form opens here', 'info'));
</script>
</body>
</html>
