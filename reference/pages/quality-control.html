<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quality Control · ERP Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#4F46E5">
</head>
<body>
<div class="app">
  <header class="topbar"></header>
  <main class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Quality Control</div>
        <div class="page-subtitle">Inspections · defects · pass rate · NCR</div>
      </div>
    </div>

    <div class="grid grid-kpi">
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Inspections Today</span></div><div class="kpi-value">14</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Pass Rate</span></div><div class="kpi-value" style="color:var(--success)">96.4%</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Open NCRs</span></div><div class="kpi-value" style="color:var(--warning)">2</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Scrap Value MTD</span></div><div class="kpi-value">₹42,800</div></div>
    </div>

    <div class="grid grid-charts" style="margin-top:var(--sp-5)">
      <div class="card">
        <div class="card-header"><div class="card-title">Defect Pareto</div></div>
        <div class="card-body" style="height:300px"><canvas id="defectChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Pass Rate Trend</div></div>
        <div class="card-body" style="height:300px"><canvas id="passChart"></canvas></div>
      </div>
    </div>

    <div class="card" style="margin-top:var(--sp-5)">
      <div class="card-header"><div class="card-title">Recent Inspections</div></div>
      <div class="card-body" id="qcTable"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
import { requireAuth } from '../js/app.js';
import { mountShell } from '../js/nav.js';
import { dataTable, toast } from '../js/components.js';
import { barChart, lineChart } from '../js/charts.js';
import * as api from '../js/api.js';

requireAuth();
const notifications = await api.getNotifications();
mountShell({ breadcrumb: ['Manufacturing', 'Quality Control'], notifications });

document.getElementById('qcTable').innerHTML = dataTable({
  columns: [
    { label: 'QC #', key: 'id', mono: true },
    { label: 'Order', key: 'order', mono: true },
    { label: 'Item', key: 'item' },
    { label: 'Sampled', align: 'right', num: true, key: 'sampled' },
    { label: 'Passed', align: 'right', num: true, key: 'passed' },
    { label: 'Defects', align: 'right', num: true, render: r => r.defects ? `<span style="color:var(--critical)">${r.defects}</span>` : '—' },
    { label: 'Inspector', key: 'insp' },
    { label: 'Result', render: r => r.defects === 0
        ? '<span class="chip chip-success">Passed</span>'
        : r.defects <= 2 ? '<span class="chip chip-warning">Conditional</span>'
        : '<span class="chip chip-critical">Failed</span>' },
  ],
  rows: [
    { id: 'QC-401', order: 'PRO-1042', item: 'Pump Assembly A', sampled: 50, passed: 50, defects: 0, insp: 'A. Verma' },
    { id: 'QC-402', order: 'PRO-1043', item: 'Motor Frame B',   sampled: 120, passed: 118, defects: 2, insp: 'A. Verma' },
    { id: 'QC-403', order: 'PRO-1044', item: 'Bracket C',        sampled: 300, passed: 294, defects: 6, insp: 'P. Nair' },
    { id: 'QC-404', order: 'PRO-1045', item: 'Valve Body E',     sampled: 80, passed: 80, defects: 0, insp: 'A. Verma' },
  ]
});

barChart('defectChart', {
  labels: ['Surface finish', 'Dimensional', 'Weld porosity', 'Assembly', 'Material'],
  datasets: [{ label: 'Defects', data: [12, 8, 5, 3, 2], color: '#DC2626' }]
});
lineChart('passChart', {
  labels: ['Mar','Apr','May','Jun','Jul','Aug'],
  datasets: [{ label: 'Pass Rate %', data: [94.2, 95.1, 96.4, 95.8, 97.2, 96.4], color: '#16A34A', fill: true }]
});
</script>
</body>
</html>
