<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Flow Forecast · ERP Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#4F46E5">
</head>
<body>
<div class="app">
  <header class="topbar"></header>
  <main class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Cash Flow Forecast</div>
        <div class="page-subtitle">Next 90 days projection</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary">Export PDF</button>
      </div>
    </div>

    <div class="grid grid-kpi">
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Opening Cash</span></div><div class="kpi-value">₹4.10 Cr</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Expected Inflow</span></div><div class="kpi-value" style="color:var(--success)">+₹2.40 Cr</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Expected Outflow</span></div><div class="kpi-value" style="color:var(--critical)">−₹2.85 Cr</div></div>
      <div class="kpi"><div class="kpi-header"><span class="kpi-label">Projected Closing</span></div><div class="kpi-value">₹3.65 Cr</div></div>
    </div>

    <div class="card" style="margin-top:var(--sp-5)">
      <div class="card-header">
        <div class="card-title">Cash Flow Bridge</div>
      </div>
      <div class="card-body" style="height:360px">
        <canvas id="cashFlowChart"></canvas>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
import { requireAuth } from '../js/app.js';
import { mountShell } from '../js/nav.js';
import { waterfallChart } from '../js/charts.js';
import * as api from '../js/api.js';

requireAuth();
const notifications = await api.getNotifications();
mountShell({ breadcrumb: ['Finance', 'Cash Flow'], notifications });

waterfallChart('cashFlowChart', {
  labels: ['Opening', 'Receivables', 'Payables', 'Payroll', 'Taxes', 'CAPEX', 'Closing'],
  values: [41000000, 24000000, -18000000, -4500000, -3200000, -2800000, 36500000]
});
</script>
</body>
</html>
