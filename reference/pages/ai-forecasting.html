<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Forecasting · ERP Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#4F46E5">
</head>
<body>
<div class="app">
  <header class="topbar"></header>
  <main class="content">
    <div class="page-header">
      <div>
        <div class="page-title">AI Forecasting</div>
        <div class="page-subtitle">Sales · Cash Flow · Inventory · Production predictions</div>
      </div>
    </div>

    <div class="tabs" id="fcTabs">
      <div class="tab active" data-tab="sales">Sales</div>
      <div class="tab" data-tab="cash">Cash Flow</div>
      <div class="tab" data-tab="inv">Inventory</div>
      <div class="tab" data-tab="prod">Production</div>
    </div>

    <div class="tab-panel active" data-panel="sales">
      <div class="card">
        <div class="card-header"><div class="card-title">Sales Forecast — Next 6 Months</div></div>
        <div class="card-body" style="height:340px"><canvas id="salesFc"></canvas></div>
      </div>
      <div class="card" style="margin-top:var(--sp-5)">
        <div class="card-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;font-size:13px">
            <div><div class="text-muted">Predicted Q3</div><div style="font-weight:600;font-size:20px">₹38.6 Cr</div></div>
            <div><div class="text-muted">Confidence</div><div style="font-weight:600;font-size:20px">88%</div></div>
            <div><div class="text-muted">Upside</div><div style="font-weight:600;font-size:20px;color:var(--success)">+₹2.4 Cr</div></div>
            <div><div class="text-muted">Downside</div><div style="font-weight:600;font-size:20px;color:var(--critical)">−₹1.8 Cr</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" data-panel="cash">
      <div class="card">
        <div class="card-header"><div class="card-title">Cash Flow Projection — Next 90 Days</div></div>
        <div class="card-body" style="height:340px"><canvas id="cashFc"></canvas></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="inv">
      <div class="card">
        <div class="card-header"><div class="card-title">Inventory Predictions</div></div>
        <div class="card-body" id="invPred"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="prod">
      <div class="card">
        <div class="card-header"><div class="card-title">Production Predictions</div></div>
        <div class="card-body" id="prodPred"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
import { requireAuth } from '../js/app.js';
import { mountShell } from '../js/nav.js';
import { lineChart } from '../js/charts.js';
import { dataTable, initTabs, statusChip } from '../js/components.js';
import * as api from '../js/api.js';

requireAuth();
const notifications = await api.getNotifications();
mountShell({ breadcrumb: ['Intelligence', 'AI Forecasting'], notifications });

lineChart('salesFc', {
  labels: ['Oct','Nov','Dec','Jan','Feb','Mar'],
  datasets: [
    { label: 'Forecast', data: [12.9, 13.6, 14.2, 13.8, 14.1, 14.8], color: '#4F46E5', fill: true },
    { label: 'Upper bound', data: [13.8, 14.6, 15.4, 15.0, 15.3, 16.0], color: '#06B6D4', dashed: true },
    { label: 'Lower bound', data: [12.0, 12.6, 13.0, 12.6, 12.9, 13.6], color: '#F59E0B', dashed: true },
  ]
});

lineChart('cashFc', {
  labels: ['W1','W2','W3','W4','W5','W6','W7','W8'],
  datasets: [{ label: 'Projected Cash (₹ Cr)', data: [4.10, 3.85, 3.62, 3.40, 3.28, 3.15, 3.42, 3.65], color: '#16A34A', fill: true }]
});

document.getElementById('invPred').innerHTML = dataTable({
  columns: [
    { label: 'Item', key: 'item', mono: true },
    { label: 'Name', key: 'name' },
    { label: 'Prediction', render: r => {
        const map = { Stockout: 'critical', Overstock: 'warning', 'Slow-moving': 'attention', 'Dead stock': 'critical', Healthy: 'success' };
        return `<span class="chip chip-${map[r.pred]}">${r.pred}</span>`;
      }},
    { label: 'Days to event', align: 'right', num: true, key: 'days' },
    { label: 'Recommended action', key: 'action' },
  ],
  rows: [
    { item: 'IT-100', name: 'Steel Plate 5mm',  pred: 'Stockout',    days: 12, action: 'Raise PR 500 KG' },
    { item: 'IT-310', name: 'Bearing SKF-6205', pred: 'Stockout',    days: 24, action: 'Raise PR 200 PCS' },
    { item: 'IT-205', name: 'Aluminium Sheet',  pred: 'Overstock',   days: null, action: 'Reduce next PO by 20%' },
    { item: 'IT-950', name: 'Legacy Gasket',    pred: 'Dead stock',  days: null, action: 'Consider write-off / scrap' },
    { item: 'IT-550', name: 'Copper Wire 2mm',  pred: 'Healthy',     days: null, action: 'No action' },
  ]
});

document.getElementById('prodPred').innerHTML = dataTable({
  columns: [
    { label: 'Work Center', key: 'wc', mono: true },
    { label: 'Prediction', render: r => {
        const map = { 'Capacity shortage': 'critical', 'Machine overload': 'warning', 'Material shortage': 'warning', 'On track': 'success' };
        return `<span class="chip chip-${map[r.pred]}">${r.pred}</span>`;
      }},
    { label: 'Impact', key: 'impact' },
    { label: 'Recommended action', key: 'action' },
  ],
  rows: [
    { wc: 'WC-03', pred: 'Machine overload',  impact: '96% util next 2 weeks', action: 'Add B shift or outsource 3 jobs' },
    { wc: 'WC-01', pred: 'Capacity shortage', impact: '85% util in Nov',        action: 'Plan maintenance for Oct' },
    { wc: 'WC-05', pred: 'Material shortage', impact: 'IT-310 coverage 24 days', action: 'Expedite PR-102' },
    { wc: 'WC-02', pred: 'On track',           impact: '—',                       action: 'No action' },
  ]
});

initTabs();
</script>
</body>
</html>
